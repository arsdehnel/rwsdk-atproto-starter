# Local AT Protocol devnet for development
#
# Usage:  pnpm docker:up && pnpm dev
#
# After first startup, test account credentials are written to data/accounts.env.
# Log in with:  alice.devnet.test  (password: alice-devnet-pass)
#
# Services adapted from https://github.com/OpenMeet-Team/atproto-devnet

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plc
    ports:
      - "5433:5432"
    networks:
      - atproto-devnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  plc:
    image: itaru2622/bluesky-did-method-plc:latest
    restart: unless-stopped
    # PLC needs DB_CREDS_JSON as a single JSON string. We can't build that with
    # compose env var interpolation, so we wrap the entrypoint to construct it
    # at runtime from individual credential vars.
    entrypoint: >
      sh -c "
        export DB_CREDS_JSON=$$(printf '{\"username\":\"%s\",\"password\":\"%s\",\"host\":\"%s\",\"port\":\"%s\",\"database\":\"%s\"}' postgres postgres postgres 5432 plc)
        export DB_MIGRATE_CREDS_JSON=$$DB_CREDS_JSON
        exec node /app/packages/server/service/index.js
      "
    environment:
      PORT: 2582
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/plc"
      ENABLE_MIGRATIONS: "true"
      LOG_ENABLED: "true"
      LOG_LEVEL: warn
      NODE_ENV: development
    ports:
      - "2582:2582"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - atproto-devnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2582/_health"]
      interval: 5s
      timeout: 3s
      retries: 10

  maildev:
    image: maildev/maildev:latest
    ports:
      - "1081:1080"
      - "1026:1025"
    networks:
      - atproto-devnet

  pds:
    image: ghcr.io/bluesky-social/pds:0.4
    user: root
    restart: unless-stopped
    depends_on:
      plc:
        condition: service_healthy
      maildev:
        condition: service_started
    environment:
      PDS_PORT: 3000
      # PDS_HOSTNAME=localhost makes the PDS use http://localhost:3000 as its public
      # URL. This lets the browser's Origin header match what the PDS expects,
      # fixing "BadRequestError: Invalid origin" during OAuth.
      PDS_HOSTNAME: localhost
      # PDS_DEV_MODE bypasses "Resource URL must use the https scheme", allowing
      # the PDS to serve its OAuth endpoints over plain HTTP.
      PDS_DEV_MODE: "true"
      PDS_DATA_DIRECTORY: /pds/data
      PDS_BLOBSTORE_DISK_LOCATION: /pds/data/blocks
      PDS_DID_PLC_URL: http://plc:2582
      PDS_BSKY_APP_VIEW_URL: https://appview.invalid
      PDS_BSKY_APP_VIEW_DID: did:example:invalid
      PDS_REPORT_SERVICE_URL: https://moderator.invalid
      PDS_REPORT_SERVICE_DID: did:example:invalid
      PDS_CRAWLERS: ""
      # Required for newer PDS builds: DID resolution calls the local plc over
      # http:// and newer builds block that without this flag.
      PDS_DISABLE_SSRF_PROTECTION: "true"
      PDS_INVITE_REQUIRED: "true"
      PDS_ADMIN_PASSWORD: devnet-admin-password
      PDS_JWT_SECRET: devnet-jwt-secret-not-for-production
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      PDS_EMAIL_SMTP_URL: smtp://maildev:1025
      PDS_EMAIL_FROM_ADDRESS: noreply@devnet.test
      PDS_HANDLE_DOMAINS: .devnet.test
      PDS_SERVICE_HANDLE_DOMAINS: .devnet.test
      LOG_ENABLED: "true"
      NODE_ENV: development
    volumes:
      - pds-data:/pds/data
    ports:
      - "3000:3000"
    networks:
      - atproto-devnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/xrpc/_health"]
      interval: 5s
      timeout: 3s
      retries: 10

  jetstream:
    image: ghcr.io/bluesky-social/jetstream:sha-05c89f0
    restart: unless-stopped
    depends_on:
      pds:
        condition: service_healthy
    environment:
      JETSTREAM_WS_URL: ws://pds:3000/xrpc/com.atproto.sync.subscribeRepos
      JETSTREAM_DATA_DIR: /data
      JETSTREAM_LIVENESS_TTL: 86400s
    volumes:
      - jetstream-data:/data
    ports:
      - "6008:6008"
    networks:
      - atproto-devnet
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6008'"]
      interval: 5s
      timeout: 3s
      retries: 10

  tap:
    image: ghcr.io/bluesky-social/indigo/tap:latest
    restart: unless-stopped
    depends_on:
      pds:
        condition: service_healthy
    environment:
      TAP_RELAY_URL: http://pds:3000
      TAP_PLC_URL: http://plc:2582
      TAP_DATABASE_URL: sqlite:///data/tap.db
      TAP_DISABLE_ACKS: "true"
      # On macOS with Docker Desktop, host.docker.internal reaches the host machine.
      # If you're on Linux, override this with your Docker bridge IP (e.g. http://172.17.0.1:5173/webhooks/tap).
      TAP_WEBHOOK_URL: ${TAP_WEBHOOK_URL:-http://host.docker.internal:5173/webhooks/tap}
      TAP_COLLECTION_FILTERS: xyz.statusphere.status
      TAP_LOG_LEVEL: info
    # PDS DID documents record serviceEndpoint as http://localhost:3000 (because PDS_HOSTNAME=localhost).
    # Inside the Tap container, "localhost" is the container itself. host-gateway maps it to the
    # host machine, where the PDS is exposed on port 3000.
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - tap-data:/data
    ports:
      - "2480:2480"
    networks:
      - atproto-devnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2480/health"]
      interval: 60s
      timeout: 5s
      retries: 5

  init:
    image: alpine:3.20
    depends_on:
      pds:
        condition: service_healthy
      plc:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - ./data:/devnet-data
    environment:
      PDS_ADMIN_PASSWORD: devnet-admin-password
      HANDLE_DOMAIN: .devnet.test
    entrypoint: /bin/sh
    command: ["/scripts/init.sh"]
    networks:
      - atproto-devnet
    restart: "no"

volumes:
  pds-data:
  jetstream-data:
  tap-data:

networks:
  atproto-devnet:
